name: Policy check

# Runs scripts/check-policies.mjs: the fork-target and workflow-permission
# policies in policies/ and the risk-tier drift check between
# docs/risk-tiers.md and risk-config.json, then the checker's own tests. Node
# built-ins only, so there is no npm install. See policies/README.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: policy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check policies
        run: node scripts/check-policies.mjs

      - name: Test the policy checker
        run: node --test scripts/tests/check-policies.test.mjs

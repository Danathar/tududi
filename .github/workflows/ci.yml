name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same PR supersedes the run still in flight. Push
# runs on main are never cancelled, so every merged commit is still tested.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run linting
      run: npm run lint

    - name: Run backend tests
      run: npm run backend:test

    - name: Upgrade legacy SQLite databases and check schema parity
      run: npm run backend:test:upgrade

    - name: Build frontend
      run: npm run build

  test-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DATABASE_URL: postgres://tududi:tududi@localhost:5432/tududi_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # The runner image ships PostgreSQL 16 (service disabled by default), so
    # no registry image is pulled and there is no pull rate limit to hit.
    - name: Start PostgreSQL
      run: |
        pg_config --version
        psql --version
        sudo systemctl start postgresql.service
        pg_isready --timeout=30
        sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE tududi LOGIN SUPERUSER PASSWORD 'tududi'"
        sudo -u postgres createdb -O tududi tududi_test

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Bootstrap an empty database and run pending migrations
      working-directory: backend
      run: |
        node scripts/db-prepare.js
        npx sequelize-cli db:migrate --config config/database.js
        node scripts/db-prepare.js
      env:
        NODE_ENV: production

    - name: Run backend tests against PostgreSQL
      run: npm run backend:test:pg

    # Legacy fixtures are always SQLite; with DATABASE_URL set the parity test
    # also compares the PostgreSQL schema produced by db-prepare.
    - name: Upgrade legacy SQLite databases and check schema parity
      run: npm run backend:test:upgrade

name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same PR supersedes the run still in flight. Push
# runs on main are never cancelled, so every merged commit is still tested.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keeps this name only because the "protect main" ruleset requires a check
  # called test-sqlite. SQLite left with v2.0.0: the backend suite runs in
  # test-postgres, and this job is the frontend build. Renaming it is a staged
  # change, see "Renaming a required check" in docs/branch-protection.md.
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build frontend
      run: npm run build

  test-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DATABASE_URL: postgres://tududi:tududi@localhost:5432/tududi_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # The runner image ships PostgreSQL 16 (service disabled by default), so
    # no registry image is pulled and there is no pull rate limit to hit.
    - name: Start PostgreSQL
      run: |
        psql --version
        sudo systemctl start postgresql.service
        pg_isready --timeout=30
        sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE tududi LOGIN SUPERUSER PASSWORD 'tududi'"
        sudo -u postgres createdb -O tududi tududi_test

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run linting
      run: npm run lint

    - name: Bootstrap an empty database and run pending migrations
      working-directory: backend
      run: |
        node scripts/db-prepare.js
        npx sequelize-cli db:migrate --config config/database.js
        node scripts/db-prepare.js
      env:
        NODE_ENV: production

    - name: Run backend tests
      run: npm run backend:test

  # Advisory: breaks the lines this PR changes on purpose (StrykerJS) and
  # reports each break the backend or frontend tests still pass, minus the
  # accepted survivors in .mutation-survivors.json. Not a required check
  # (docs/branch-protection.md). Upstream syncs are skipped: upstream code is
  # not this fork's to test. See docs/quality.md.
  mutation:
    name: Mutation check on changed lines (advisory)
    if: "github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'chore: sync upstream')"
    runs-on: ubuntu-24.04
    # The budget below ends the run on its own before this timeout, which stays
    # as a backstop: a job cut off by its timeout fails the check even with
    # continue-on-error, and that blocks the merge (#435).
    timeout-minutes: 60
    continue-on-error: true

    env:
      DATABASE_URL: postgres://tududi:tududi@localhost:5432/tududi_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    # The backend suites need PostgreSQL, started as in test-postgres.
    - name: Start PostgreSQL
      run: |
        psql --version
        sudo systemctl start postgresql.service
        pg_isready --timeout=30
        sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE tududi LOGIN SUPERUSER PASSWORD 'tududi'"
        sudo -u postgres createdb -O tududi tududi_test

    - name: Mutate the lines this PR changes
      env:
        BASE_REF: ${{ github.base_ref }}
      # 50 of the job's 60 minutes, leaving the rest for checkout, npm install
      # and stopping Stryker. At the budget the check exits 0 with an
      # "incomplete" warning instead of running into the job timeout.
      run: node scripts/mutation-check.mjs --base "origin/$BASE_REF" --budget-minutes 50

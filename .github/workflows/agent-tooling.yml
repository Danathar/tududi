# Runs the Node built-in tests for the repo's agent tooling: the Claude Code
# hooks under .claude/hooks/ (notably guard-bash.mjs, which keeps agents from
# touching chrisvel/tududi) and the helper scripts under scripts/. It also runs
# scripts/check-fork-delta.mjs, which keeps docs/fork-delta.md in step with the
# fork's changes to upstream-owned files.
# These tests need no npm install; only Node is used.
#
# Other slices add test files over time, so the file list is built in shell
# and an empty glob does not fail the job.
#
# No path filter: the `agent-tooling` job is a required check in the main
# ruleset (docs/branch-protection.md), and a required check must report on
# every pull request, or a pull request that does not touch these paths waits
# for it forever. Renaming the job blocks every merge until the ruleset matches.
name: Agent tooling

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: agent-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: agent-tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # check-fork-delta.mjs compares against the upstream commit of the
          # last sync merge, which a shallow clone does not contain.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run agent tooling tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(scripts/tests/**/*.test.mjs .claude/hooks/tests/**/*.test.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No agent tooling tests found; nothing to run."
            exit 0
          fi
          printf 'Running %s test file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          node --test "${files[@]}"

      - name: Check the fork-delta ledger
        # Fails when a change to a file upstream also has is missing from
        # docs/fork-delta.md, or a listed file now matches upstream again.
        run: node scripts/check-fork-delta.mjs

name: Nightly compliance

# Checks that drift slowly and are too slow or too noisy for ci.yml: the full
# backend suite, lint, npm audit of production dependencies, the licence rules
# from AGENTS.md (section Licensing), the coverage gate, and a compare of
# policies/check-policies-corpus.json with its canonical copy in
# Danathar/dns-failover (Danathar/akmods#245). On a scheduled
# failure it opens or updates ONE tracking issue in this repository (GH_REPO
# below; never upstream chrisvel/tududi). It never closes the issue.
# Tunables (audit blocking, recorded licence hash): .github/auto-qa-tuning.json.
#
# npm audit is report-only by default (nightly.audit_blocking = false) because
# main carries known high/critical advisories that need dependency upgrades.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-compliance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    env:
      DATABASE_URL: postgres://tududi:tududi@localhost:5432/tududi_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Licence compliance
        id: licence
        continue-on-error: true
        run: |
          cfg=.github/auto-qa-tuning.json
          rc=0
          want=$(jq -r '.licence.license_mit_sha256' "$cfg")
          got=$(sha256sum LICENSE.MIT | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "LICENSE.MIT changed: sha256 $got, recorded $want"; rc=1
          fi
          want_pkg=$(jq -r '.licence.package_license' "$cfg")
          got_pkg=$(jq -r '.license' package.json)
          if [ "$got_pkg" != "$want_pkg" ]; then
            echo "package.json license is $got_pkg, expected $want_pkg"; rc=1
          fi
          want_lock=$(jq -r '.packages[""].license' package-lock.json)
          if [ "$want_lock" != "$want_pkg" ]; then
            echo "package-lock.json root license is $want_lock, expected $want_pkg"; rc=1
          fi
          want_sw=$(jq -r '.licence.swagger_license' "$cfg")
          if ! grep -Eq "name: '$want_sw'" backend/config/swagger.js; then
            echo "backend/config/swagger.js license name is not $want_sw"; rc=1
          fi
          [ "$rc" -eq 0 ] && echo "Licence checks passed."
          exit "$rc"

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      # The backend suite needs a PostgreSQL server. The runner image ships
      # PostgreSQL 16 (service disabled by default), as in ci.yml.
      - name: Start PostgreSQL
        continue-on-error: true
        run: |
          psql --version
          sudo systemctl start postgresql.service
          pg_isready --timeout=30
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE tududi LOGIN SUPERUSER PASSWORD 'tududi'"
          sudo -u postgres createdb -O tududi tududi_test

      - name: Backend tests (full suite)
        id: tests
        continue-on-error: true
        run: npm run backend:test:coverage -- --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Frontend coverage
        continue-on-error: true
        run: npm run frontend:test:coverage -- --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Coverage gate
        id: gate
        continue-on-error: true
        run: node scripts/coverage-gate.mjs

      - name: npm audit (production dependencies)
        id: audit
        continue-on-error: true
        run: |
          level=$(jq -r '.nightly.audit_level' .github/auto-qa-tuning.json)
          npm audit --omit=dev --audit-level="$level"

      # policies/check-policies-corpus.json is a copy of the canonical file in
      # Danathar/dns-failover (Danathar/akmods#245). The checker test pins the
      # copy's hash, which catches a local edit but not a copy that has fallen
      # behind its original, so this compares it with dns-failover's main.
      - name: Check-policies corpus
        id: corpus
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS: policies/check-policies-corpus.json
        run: |
          set -euo pipefail
          want=$(gh api "repos/Danathar/dns-failover/contents/$CORPUS" -H 'Accept: application/vnd.github.raw' | sha256sum | cut -d' ' -f1)
          got=$(sha256sum "$CORPUS" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::$CORPUS is $got; Danathar/dns-failover main has $want. Copy the file from there and update CORPUS_SHA256 in scripts/tests/check-policies.test.mjs."
            exit 1
          fi
          echo "$CORPUS matches Danathar/dns-failover main ($got)."

      - name: Summarize and decide
        id: verdict
        env:
          LICENCE: ${{ steps.licence.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          GATE: ${{ steps.gate.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          CORPUS_RESULT: ${{ steps.corpus.outcome }}
        run: |
          blocking=$(jq -r '.nightly.audit_blocking' .github/auto-qa-tuning.json)
          failed=""
          for pair in "licence:$LICENCE" "lint:$LINT" "backend tests:$TESTS" "coverage gate:$GATE" "check-policies corpus:$CORPUS_RESULT"; do
            [ "${pair#*:}" = "success" ] || failed="$failed ${pair%%:*};"
          done
          if [ "$AUDIT" != "success" ] && [ "$blocking" = "true" ]; then
            failed="$failed npm audit;"
          fi
          {
            echo "## Nightly compliance"
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| licence | $LICENCE |"
            echo "| lint | $LINT |"
            echo "| backend tests | $TESTS |"
            echo "| coverage gate | $GATE |"
            echo "| check-policies corpus | $CORPUS_RESULT |"
            echo "| npm audit (blocking=$blocking) | $AUDIT |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]

      - name: Open or update the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Nightly compliance failing'
          FAILED: ${{ steps.verdict.outputs.failed }}
        run: |
          body=$(printf 'The nightly compliance run failed on %s.\n\nFailed checks:%s\n\nRun: %s/%s/actions/runs/%s\n\nThis issue is not closed automatically; close it once the nightly is green.\n' \
            "$(date -u +%Y-%m-%d)" "${FAILED:- unknown (see run)}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --repo "$GH_REPO" --state open --limit 1000 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]" or .author.login == "github-actions"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment --repo "$GH_REPO" "$existing" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$body"
          fi

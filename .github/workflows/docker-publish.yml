name: Publish Docker image

# Builds this fork's image from main and pushes it to ghcr.io/danathar/tududi
# as :latest, :sha-<short commit> and :v<package.json version>-<short commit>.
# Every push to main publishes. A manual run republishes main and is refused
# from any other branch or tag, so unmerged code never becomes :latest.
#
# package.json keeps upstream's version, so the version tag names the upstream
# release this build is based on. Upstream's Docker Hub image and GitHub
# Releases are not used here. ghcr.io uses the workflow's own GITHUB_TOKEN, so
# no secrets are needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes an older one still building, so :latest
# never moves back to an older commit. The group is per ref, so a refused
# manual run from another branch cannot cancel a main build.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/danathar/tududi

jobs:
  # Each platform builds on a runner of its own CPU. Building arm64 under
  # QEMU crashed npm install at random (Illegal instruction) and shipped an
  # arm64 image without its node_modules (upstream #1725).
  build:
    # Manual runs too: only main is ever published.
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Platform slug
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/Danathar/tududi
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha,scope=${{ steps.platform.outputs.slug }}
          cache-to: type=gha,scope=${{ steps.platform.outputs.slug }},mode=max

      - name: Smoke test the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE@$DIGEST" -c \
            "cd /app/backend && node -e \"require('sequelize'); require('sqlite3'); require('express')\""

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags are only moved once every platform built, so :latest never points
  # at a partial image.
  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Read the upstream version from package.json
        uses: actions/checkout@v5
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Resolve tags
        id: tags
        run: |
          SHORT="${GITHUB_SHA::7}"
          VERSION="$(jq -r '.version // empty' package.json)"
          VERSION="${VERSION#v}"
          echo "short=sha-$SHORT" >> "$GITHUB_OUTPUT"
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "versioned=v$VERSION-$SHORT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::package.json version '$VERSION' is not a version; skipping the version tag"
          fi

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push the multi-platform tags
        working-directory: /tmp/digests
        env:
          SHORT_TAG: ${{ steps.tags.outputs.short }}
          VERSIONED_TAG: ${{ steps.tags.outputs.versioned }}
        run: |
          set -- -t "$IMAGE:latest" -t "$IMAGE:$SHORT_TAG"
          if [ -n "$VERSIONED_TAG" ]; then
            set -- "$@" -t "$IMAGE:$VERSIONED_TAG"
          fi
          for digest in *; do
            set -- "$@" "$IMAGE@sha256:$digest"
          done
          docker buildx imagetools create "$@"

      - name: Print digest
        env:
          SHORT_TAG: ${{ steps.tags.outputs.short }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$SHORT_TAG" | tee -a "$GITHUB_STEP_SUMMARY"

name: Publish Docker image

# Builds this fork's image from main and pushes it to
# ghcr.io/danathar/tududi as :latest and :sha-<short commit>. Every push to
# main publishes; a manual run republishes the current main.
#
# Upstream's version tags, Docker Hub image and GitHub Releases are not used
# here. ghcr.io uses the workflow's own GITHUB_TOKEN, so no secrets are needed.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older one still building, so :latest never
# moves back to an older commit.
concurrency:
  group: docker-publish
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/danathar/tududi

jobs:
  # Each platform builds on a runner of its own CPU. Building arm64 under
  # QEMU crashed npm install at random (Illegal instruction) and shipped an
  # arm64 image without its node_modules (upstream #1725).
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Platform slug
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/Danathar/tududi
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha,scope=${{ steps.platform.outputs.slug }}
          cache-to: type=gha,scope=${{ steps.platform.outputs.slug }},mode=max

      - name: Smoke test the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE@$DIGEST" -c \
            "cd /app/backend && node -e \"require('sequelize'); require('sqlite3'); require('express')\""

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags are only moved once every platform built, so :latest never points
  # at a partial image.
  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push the multi-platform tags
        working-directory: /tmp/digests
        run: |
          SHORT="sha-${GITHUB_SHA::7}"
          set -- -t "$IMAGE:latest" -t "$IMAGE:$SHORT"
          for digest in *; do
            set -- "$@" "$IMAGE@sha256:$digest"
          done
          docker buildx imagetools create "$@"
          echo "short=$SHORT" >> "$GITHUB_ENV"

      - name: Print digest
        run: |
          docker buildx imagetools inspect "$IMAGE:$short" | tee -a "$GITHUB_STEP_SUMMARY"

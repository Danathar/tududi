# Claude Code on demand: a maintainer mentions `@claude` in an issue comment,
# a PR conversation comment, or a PR review comment, and the Claude Code
# GitHub Action answers or makes the change on a branch.
#
# Gating, in order:
#   1. `if:` skips (grey run, not red) any comment that lacks `@claude` or
#      whose author is not OWNER, MEMBER or COLLABORATOR. Anyone can comment
#      on a public repo; a refusal there would be a red run nobody can clear.
#   2. A collaborator-permission check requires admin/write on this repo.
#   3. For a PR, the head branch must live in this repository. Fork PRs are
#      refused: a fork branch is untrusted code, and this job holds a write
#      token and an Anthropic credential.
#   4. If neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is configured,
#      the job writes a step summary saying so and skips the agent. It does
#      not fail red. Set exactly one of the two secrets.
#
# No `pull_request_target`: with write permissions it is the classic
# privilege-escalation shape. `issue_comment` and `pull_request_review_comment`
# run from the default branch's copy of this file and only for maintainers.
#
# `/ai-fix` and the `ai-fix-requested` label are handled by ai-fix.yml, which
# calls the same action. Repository rules the agent must follow live in
# AGENTS.md; review standards live in docs/review-rubric.md.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  claude:
    if: >-
      github.event.sender.type != 'Bot' &&
      contains(github.event.comment.body, '@claude') && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check requester is a maintainer
        id: maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          role=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" \
                   --jq '.permission' 2>/dev/null || echo none)
          case "$role" in
            admin|write) echo "$ACTOR has $role; proceeding" ;;
            *) echo "::error::$ACTOR lacks write access (got '$role'); refusing."; exit 1 ;;
          esac

      - name: Resolve target and refuse fork or closed PRs
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment' }}
        run: |
          ref=""
          proceed=true
          if [ "$IS_PR" = "true" ]; then
            read -r cross state head < <(gh pr view "$NUM" \
              --json isCrossRepository,state,headRefName \
              --jq '[.isCrossRepository, .state, .headRefName] | @tsv')
            if [ "$cross" = "true" ]; then
              proceed=false
              reason="PR #$NUM comes from a fork. Only same-repository branches are handled."
            elif [ "$state" != "OPEN" ]; then
              proceed=false
              reason="PR #$NUM is $state; nothing to do."
            else
              ref="$head"
            fi
          fi
          if [ "$proceed" = "false" ]; then
            gh issue comment "$NUM" --body "Claude did not run: $reason"
            {
              echo "## Claude skipped"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "proceed=$proceed"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      - name: Detect Anthropic credential
        id: auth
        if: steps.target.outputs.proceed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Claude is not configured"
              echo
              echo "The request passed the gates, but this repository has no"
              echo "Anthropic credential, so the agent step was skipped."
              echo
              echo "To enable it, add one repository secret:"
              echo "- \`ANTHROPIC_API_KEY\` (API billing), or"
              echo "- \`CLAUDE_CODE_OAUTH_TOKEN\` (from \`claude setup-token\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v5
        if: steps.target.outputs.proceed == 'true' && steps.auth.outputs.configured == 'true'
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      # anthropics/claude-code-action v1.0.248 (annotated tag dereferenced to
      # its commit). Input names checked against that release's action.yml.
      - name: Run Claude Code
        if: steps.target.outputs.proceed == 'true' && steps.auth.outputs.configured == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 30
            --append-system-prompt "This repository is the fork Danathar/tududi, never chrisvel/tududi (upstream). Read AGENTS.md first, section 'This repository is a fork. All work happens here.' Every gh pr, gh issue, gh release and gh workflow command must pass --repo Danathar/tududi; PRs use --base main. Never open, comment on or label anything on chrisvel/tududi, never push to any remote except origin, never bump the version in package.json. Follow CLAUDE.md for code style, tests and migrations. Judge review findings by docs/review-rubric.md: verify each claim against the code before acting, and say so when a finding is wrong or not actionable. Do not merge pull requests."
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh pr create --repo Danathar/tududi:*),Bash(gh pr view --repo Danathar/tududi:*),Bash(gh pr comment --repo Danathar/tududi:*),Bash(gh issue view --repo Danathar/tududi:*),Bash(gh issue comment --repo Danathar/tududi:*),Bash(npm run backend:test:*),Bash(npm run frontend:test:*),Bash(npm run lint:*),Bash(npm run backend:lint:*),Bash(npm run frontend:lint:*),Bash(npm run format:*)"
